services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockmarket
      POSTGRES_USER: stockmarket
      POSTGRES_PASSWORD: stockmarket
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockmarket"]
      interval: 5s
      timeout: 3s
      retries: 5

  app1:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: stockmarket
      DB_USER: stockmarket
      DB_PASS: stockmarket
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: always

  app2:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: stockmarket
      DB_USER: stockmarket
      DB_PASS: stockmarket
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: always

  app3:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: stockmarket
      DB_USER: stockmarket
      DB_PASS: stockmarket
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  pgdata:
